<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Iris AI</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; }
    #messages { border: 1px solid #cd2424; height: 400px; overflow-y: auto; padding: 1rem; }
    .user { color: blue; margin: 0.5rem 0; }
    .ai { margin: 0.5rem 0; white-space: pre-wrap; }
    #input { width: 80%; padding: 0.5rem; }
    button { padding: 0.5rem 1rem; }
  </style>
</head>
<body>
  <h1>Iris AI</h1>
  <div id="messages"></div>
  <input id="input" placeholder="Type a message...">
  <button id="send">Send</button>

  <script>
    const messagesDiv = document.getElementById("messages");
    const input = document.getElementById("input");
    const sendButton = document.getElementById("send");

    function addMessage(cssClass, text) {
      const div = document.createElement("div");
      div.className = cssClass;
      div.textContent = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (text === "") return;
      input.value = "";
      addMessage("user", "You: " + text);
      const waiting = addMessage("ai", "Thinking...");
      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text }),
        });
        const data = await response.json();
        waiting.textContent = "AI: " + (data.answer || JSON.stringify(data));
      } catch (error) {
        waiting.textContent = "Error: " + error;
      }
    }

    sendButton.addEventListener("click", sendMessage);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
