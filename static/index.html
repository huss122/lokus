<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Husse AI</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; }
    #messages { border: 1px solid #cd2424; height: 400px; overflow-y: auto; padding: 1rem; }
    .user { color: blue; margin: 0.5rem 0; }
    .ai { margin: 0.5rem 0; white-space: pre-wrap; }
    #input { width: 80%; padding: 0.5rem; }
    button { padding: 0.5rem 1rem; }
  </style>
</head>
<body>
  <h1>Husse AI</h1>
  <div id="messages"></div>
  <input id="input" placeholder="Type a message...">
  <button id="send">Send</button>

  <script>
    const messagesDiv = document.getElementById("messages");
    const input = document.getElementById("input");
    const sendButton = document.getElementById("send");
    let history = [];

    function addMessage(cssClass, text) {
      const div = document.createElement("div");
      div.className = cssClass;
      div.textContent = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      return div;
    }

    async function sendMessage() {
    const text = input.value.trim();
    if (text === "") return;
    input.value = "";
    addMessage("user", "You: " + text);
    history.push({ role: "user", content: text });

    const aiDiv = addMessage("ai", "AI: ...");
    let answer = "";
    let failed = false;

    function handleLine(line) {
      if (line.trim() === "") return;
      const data = JSON.parse(line);
      if (data.error || data.detail) {
        failed = true;
        aiDiv.textContent = "Error: " + JSON.stringify(data.error || data.detail);
        return;
      }
      if (data.message && data.message.content) {
        answer += data.message.content;
        aiDiv.textContent = "AI: " + answer;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }
      if (data.done && data.total_duration) {
        const seconds = data.total_duration / 1e9;
        aiDiv.textContent = "AI: " + answer + " (" + seconds.toFixed(1) + " s)";
      }
    }

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();
        for (const line of lines) handleLine(line);
      }
      handleLine(buffer);

      if (failed || answer === "") {
        history.pop();
      } else {
        history.push({ role: "assistant", content: answer });
      }
    } catch (error) {
      aiDiv.textContent = "Error: " + error;
      history.pop();
    }
  }

    sendButton.addEventListener("click", sendMessage);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
